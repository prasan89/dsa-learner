name: Backend JUnit Coverage

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-junit-coverage.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-junit-coverage.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify with JUnit and JaCoCo
        run: mvn -B verify
