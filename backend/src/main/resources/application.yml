spring:
  application:
    name: dsa-learner-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/dsa_learner}
    username: ${SPRING_DATASOURCE_USERNAME:dsa_user}
    password: ${SPRING_DATASOURCE_PASSWORD:dsa_password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

server:
  port: 8080
  error:
    include-message: always

app:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-use-256-bit-secret-key-here}
    access-token-expiry-ms: 900000       # 15 minutes
    refresh-token-expiry-ms: 604800000   # 7 days

  execution-service:
    url: ${EXECUTION_SERVICE_URL:http://localhost:8081}
    timeout-ms: 10000

  ai:
    api-key: ${ANTHROPIC_API_KEY:f753ba5e-1014-4c17-b469-fe1eb19c2e0a}
    base-url: ${ANTHROPIC_BASE_URL:http://localhost:6655}
    hint-model: claude-haiku-4-5-20251001
    review-model: claude-sonnet-4-6
    max-tokens: 2048

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
