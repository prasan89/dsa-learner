version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: dsa_postgres
    environment:
      POSTGRES_DB: dsa_learner
      POSTGRES_USER: dsa_user
      POSTGRES_PASSWORD: dsa_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsa_user -d dsa_learner"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: dsa_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dsa_backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/dsa_learner
      SPRING_DATASOURCE_USERNAME: dsa_user
      SPRING_DATASOURCE_PASSWORD: dsa_password
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      EXECUTION_SERVICE_URL: http://execution-service:8081
      ANTHROPIC_BASE_URL: http://host.docker.internal:6655
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  execution-service:
    build:
      context: ./execution-service
      dockerfile: Dockerfile
    container_name: dsa_execution
    ports:
      - "8081:8081"
    environment:
      MAX_EXECUTION_TIME_MS: 5000
      MAX_MEMORY_MB: 128
    network_mode: bridge
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dsa_frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
